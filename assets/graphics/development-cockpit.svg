<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Tydel Development Cockpit</title>
  <desc id="desc">Mörk operations-tavla som visar Tydels aktuella milstolpe, ansvar, status och nästa steg.</desc>
  <rect width="1400" height="720" rx="20" fill="#0b0c0d"/>
  <rect x="22" y="22" width="1356" height="676" rx="12" fill="#111315" stroke="#34383d" stroke-width="2"/>
  <style>
