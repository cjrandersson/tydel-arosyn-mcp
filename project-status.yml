version: 1
updated: 2026-10-07

product:
  strategy: validator_first_conformance
  category: "Energy Market Conformance & Diagnostics"
  delivery_model: "local-first developer conformance and CI/CD layer"
  north_star: "Build the deterministic conformance and diagnostics layer for energy-market interoperability."
  positioning: "Tydel avgör vilka tekniska och marknadsmässiga regler som gäller för en energimarknadstransaktion, validerar den deterministiskt och visar exakt vad som är fel, varför och vilken evidens som stöder resultatet."
  developer_promise: "Catch energy-market integration errors before external test or production systems do."
  first_wedge: "Swedish Ediel, with UTILTS/APERAK as the first M1 vertical slice."
  core_competency: "Rule resolution + versioned executable RulePacks + provenance-backed deterministic validation."
  primary_surfaces:
    - local_cli
    - ci_cd_gate
    - github_action
  secondary_surfaces:
    - api
    - ui
    - mcp
  product_hypotheses:
    - pre_validation
    - diagnostics
    - change_impact
    - migration_assurance
  later_expansion:
    - XML/CIM/IEC 62325 and ENTSO-E ESMP for selected market processes
    - future DHV interfaces when authoritative technical contracts exist
    - Nordic rule packs where customer evidence supports expansion
  guardrails:
    - "Ediel is the first wedge, not the permanent product boundary."
    - "MCP and AI are access/explanation layers, not validation authority or the moat."
    - "Do not claim a future DHV protocol, CIM profile or migration date without authoritative evidence."
    - "Do not widen M1 into multi-protocol implementation before the first vertical slice is proven."
    - "<15 ms local validation is a performance target, not a product claim, until a reproducible benchmark is defined and measured."

