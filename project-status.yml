rule_operations:
  state: active_design
  owner: ChatGPT
  decision: "Rule IR before a custom DSL."
  target_for_m1_contract: "Represent 30-50 normative rules or enough real rule diversity to expose the first stable primitives; the number is an engineering target, not a market fact."
  required_metadata:
    - rule_id
    - jurisdiction
    - process
    - message_or_profile
    - syntax
    - effective_from
    - effective_to
    - assertion
    - evidence_source
    - evidence_location
    - review_status
  scaling_question: "Can verified RulePacks be created and updated faster than market rules change without turning Tydel into a consulting-heavy business?"

